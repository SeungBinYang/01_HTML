<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 사용법 안내</title>
</head>
<body>
    <p>
        <h1>오늘의마켓 상품 사용법</h1>
        처음 쓰는 분을 위한 3분 요약 영상입니다.
    </p>
    <hr>
    <p>
        <h2>영상으로 보기</h2>
        <video src="video/video1.mp4" controls="controls"></video>
        <br>
        소리만 듣고 싶다면 아래를 재생하세요.
        <br>
        <audio src="audio/major.mp3" controls="controls"></audio>
    </p>
    <hr>
    <p>
        <h2>먼저 본 분들의 한마디</h2>
        <p>
            <q>설명이 짧아서 좋았습니다.</q>
        </p>
        <p>
            문의: 1234-5678
        </p>
    </p>
</body>
</html>
