<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공연 예매 요금표</title>
</head>
<body>
    <table border="1">
        <caption>2월 정기공연 요금 안내</caption>
        <tr>
            <th rowspan="2" colspan="2">구분</th>
            <th colspan="2">평일</th>
            <th colspan="2">주말</th>
        </tr>
        <tr>
            <th>S석</th>
            <th>VIP석</th>
            <th>S석</th>
            <th>VIP석</th>
        </tr>
        <tr>
            <th rowspan="2">개인</th>
            <th>성인</th>

            <td>30,000</td>
            <td>50,000</td>
            <td>40,000</td>
            <td>60,000</td>
        </tr>
        <tr>
            <th>청소년</th>
            <td>25,000</td>
            <td>45,000</td>
            <td>35,000</td>
            <td>55,000</td>
        </tr>
            <th rowspan="2">단체</th>
            <th>20인 이상</th>
            <td colspan="2">24,000</td>
            <td colspan="2">32,000</td>
        </tr>
        <tr>
            <th>50인 이상</th>
            <td colspan="4">20,000</td>
        </tr>
        <tr>
            <th colspan="2">미취학 아동</th>
            <td colspan="4">일반 요금의 50%</td>
        </tr>
        <tr>
            <td colspan="6">장애인</td>
        </tr>
    </table>
</body>
</html>
