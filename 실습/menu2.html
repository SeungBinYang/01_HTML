<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주간 식단표</title>
</head>
<body>
    <h1>주간 식단표</h1>
    <table border="1">
        <caption>이번 주 구내식당 식단</caption>
            <tr>
                <th rowspan="2">구분</th>
                <th colspan="5">평일</th>
                <th colspan="2">주말</th>
            </tr>
            <tr>
                <td>월</td>
                <td>화</td>
                <td>수</td>
                <td>목</td>
                <td>금</td>
                <td>토</td>
                <td>일</td>
            </tr>
            <tr>
                <th>밥</th>
                <td colspan="2">쌀밥</td>
                <td colspan="3">잡곡밥</td>
                <td>스파게티</td>
                <td>짜장면</td>
            </tr>
            <tr>
                <th>주찬</th>
                <td>불고기</td>
                <td>떡갈비</td>
                <td>미니돈까스</td>
                <td>오징어볶음</td>
                <td>제육볶음</td>
                <td rowspan="2">탕수육</td>
                <td>탄무지</td>
            </tr>
            <tr>
                <th>부찬</th>
                <td>배추김치</td>
                <td>깍두기</td>
                <td>미소된장국</td>
                <td>동차마</td>
                <td>고추절임</td>
                <td>짬뽕국물</td>
            </tr>
            <tr>
                <th>후식</th>
                <td colspan="3" rowspan="2">요거트</td>
                <td colspan="2">사과</td>
                <td colspan="2">식혜</td>
            </tr>
            <tr>
                <th>음료</th>
                <td colspan="4">보리차</td>
            </tr>
            <tr>
                <td colspan="8">알레르기 유발 식품은 식당 게시판에서 확인하세요</td>
            </tr>

        </caption>
    </table>
</body>
</html>
