<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>병합 퍼즐</title>
</head>
<body>
    <h1>병합 퍼즐</h1>
    <style>
        td {
            vertical-align: top;
        }
    </style>
    <table border="1" style="text-align:left">
        <tr>
            <td>가</td>
            <td>나</td>
            <td>다</td>
            <td rowspan="3">라</td>
            <td rowspan="2">마</td>
        </tr>
        <tr>
            <td rowspan="2" colspan="2">바</td>
            <td>사</td>
        </tr>
        <tr>
            <td>아</td>
            <td>자</td>
        </tr>
        <tr>
            <td>차</td>
            <td colspan="2">카</td>
            <td colspan="2" rowspan="2">타</td>
        </tr>
        <tr>
            <td colspan="3">파</td>
        </tr>
        <tr>
            <td rowspan="2">하</td>
            <td colspan="2">거</td>
            <td>너</td>
            <td>더</td>
        </tr>
        <tr>
            <td colspan="4">러</td>
        </tr>
    </table>
</body>
</html>
