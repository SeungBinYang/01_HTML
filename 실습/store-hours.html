<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지점별 운영 시간</title>
</head>
<body>
    <h1>지점별 운영 시간</h1>
    <table border="1">
        <caption>지점별 운영 시간</caption>
        <tr>
            <th rowspan="2" colspan="2">지점</th>
            <th colspan="2">평일</th>
            <th colspan="2">주말</th>
        </tr>
        <tr>
            <th>오전</th>
            <th>오후</th>
            <th>오전</th>
            <th>오후</th>
        </tr>
        <tr>
            <th>강남</th>
            <td>1층</td>
            <td>운영</td>
            <td>운영</td>
            <td>운영</td>
            <td>운영</td>
        </tr>
        <tr>
            <th rowspan="2">홍대</th>
            <td>1층</td>
            <td colspan="2">운영</td>
            <td>운영</td>
            <td>운영</td>
        </tr>
        <tr>
            <td>2층</td>
            <td colspan="4">준비 중</td>
        </tr>
        <tr>
            <td colspan="6">전 지점 명절 당일 휴무</td>
        </tr>
    </table>
</body>
</html>
