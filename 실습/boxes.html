<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>묶는 방법 두 가지</title>
</head>
<body>
    <h2>div로 묶으면</h2>
    <div>커피 내리기</div>
    <div>영화 보기</div>
    <div>주말 산책</div>
    <h2>span으로 묶으면</h2>
    <span>커피 내리기</span>
    <span>영화 보기</span>
    <span>주말 산책</span>
    
</body>
</html>
