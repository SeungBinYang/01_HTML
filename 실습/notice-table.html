<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배송 안내</title>
</head>
<body>
    <h1>배송 안내</h1>
    <table border="1">
        <caption>지역별 도착 예정일</caption>
        <tr>
            <th>지역</th>
            <th>평일 주문</th>
            <th>주말 주문</th>
        </tr>
        <tr>
            <td>서울/경기</td>
            <td>다음날 도착</td>
            <td>월요일 도착</td>
        </tr>
        <tr>
            <td>그 외 지역</td>
            <td colspan="2">2~3일 소요</td>
        </tr>
        <tr>
            <td colspan="3">제주/도서 산간은 하루 더 걸립니다</td>
        </tr>
    </table>
</body>
</html>
